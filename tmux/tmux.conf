##### -------------------------------------------------
##### General
##### -------------------------------------------------

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Windows/Panes start at 1
set -g base-index 1
set -g pane-base-index 1

# History
set -g history-limit 100000

# Faster command response
set -sg escape-time 1

# Mouse
set -g mouse on
# Pipe mouse and keyboard selections directly to your system clipboard
# For Linux (requires xclip):
set -s copy-command 'xclip -selection clipboard -in'

# Vi keys in copy mode
setw -g mode-keys vi

# Don't rename windows automatically
set -g allow-rename off

# Focus events
set -g focus-events on

# Extended keys
set -g extended-keys on


##### -------------------------------------------------
##### Terminal / True Color
##### -------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


##### -------------------------------------------------
##### Splits
##### -------------------------------------------------

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"


##### -------------------------------------------------
##### Reload
##### -------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"


##### -------------------------------------------------
##### Navigation
##### -------------------------------------------------

unbind p
bind p previous-window


# Alt arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# Vim style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### -------------------------------------------------
##### Pane Resize
##### -------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


##### -------------------------------------------------
##### Bells
##### -------------------------------------------------

set -g visual-activity on
set -g visual-bell on
set -g visual-silence off

setw -g monitor-activity off
set -g bell-action none


##### -------------------------------------------------
##### Everforest Colors
##### -------------------------------------------------

# Background  #2b3339
# Surface     #323c41
# Foreground  #d3c6aa
# Grey        #859289
# Green       #a7c080
# Blue        #7fbbb3
# Yellow      #dbbc7f
# Orange      #e69875


##### -------------------------------------------------
##### Status Bar
##### -------------------------------------------------

set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#2b3339 fg=#d3c6aa"


##### -------------------------------------------------
##### Left Status
##### -------------------------------------------------

set -g status-left-length 25

set -g status-left '#{?client_prefix,#[fg=#e69875]#[bg=#e69875 fg=#2b3339] PREFIX #[fg=#e69875 bg=#2b3339],#[fg=#7fbbb3]#[bg=#7fbbb3 fg=#2b3339] TMUX #[fg=#7fbbb3 bg=#2b3339]}'


##### -------------------------------------------------
##### Right Status
##### -------------------------------------------------

set -g status-right-length 40

set -g status-right '#[fg=#dbbc7f]#[bg=#dbbc7f fg=#2b3339] %Y-%m-%d %H:%M #[fg=#dbbc7f bg=#2b3339]'


##### -------------------------------------------------
##### Windows
##### -------------------------------------------------

setw -g window-status-separator " "

setw -g window-status-style \
"fg=#859289 bg=#2b3339"

setw -g window-status-format \
" #I #W "

setw -g window-status-current-style \
"fg=#2b3339 bg=#a7c080 bold"

setw -g window-status-current-format \
"#[fg=#a7c080]#[bg=#a7c080 fg=#2b3339] #I #W #[fg=#a7c080 bg=#2b3339]"


setw -g window-status-bell-style \
"fg=#2b3339 bg=#e69875 bold"


##### -------------------------------------------------
##### Panes
##### -------------------------------------------------

set -g pane-border-style \
"fg=#4f5b58"

set -g pane-active-border-style \
"fg=#a7c080"


##### -------------------------------------------------
##### Copy Mode
##### -------------------------------------------------

setw -g mode-style \
"fg=#2b3339 bg=#a7c080 bold"


##### -------------------------------------------------
##### Messages
##### -------------------------------------------------

set -g message-style \
"fg=#2b3339 bg=#dbbc7f bold"


##### -------------------------------------------------
##### Clock
##### -------------------------------------------------

setw -g clock-mode-colour "#a7c080"
